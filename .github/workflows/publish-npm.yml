name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: npm version to publish (for example 0.2.6)
        required: true
        type: string
      npm_scope:
        description: npm account scope without @
        required: true
        type: string
        default: trietitan

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Validate release version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          NPM_SCOPE: ${{ inputs.npm_scope }}
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.env.PACKAGE_VERSION)) { throw new Error("version must be numeric major.minor.patch"); } if (!/^[a-z0-9][a-z0-9._-]*$/.test(process.env.NPM_SCOPE)) { throw new Error("npm_scope must be a valid npm username/scope without @"); }'

      - name: Test npm launcher
        run: npm test --prefix npm/astra-ai

      - name: Set package version and name
        working-directory: npm/astra-ai
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          NPM_SCOPE: ${{ inputs.npm_scope }}
        run: |
          npm pkg set name="@${NPM_SCOPE}/astra-ai" version="$PACKAGE_VERSION"
          node -p "require('./package.json').name + ' ' + require('./package.json').version"

      - name: Publish scoped package
        working-directory: npm/astra-ai
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured in repository secrets."
            exit 1
          fi
          npm publish --access public
