name: AStra route impact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  astra:
    name: AStra route impact
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze route impact
        uses: ./.github/actions/astra-check
        with:
          base: origin/${{ github.base_ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"