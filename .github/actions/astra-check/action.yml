name: AStra route impact check
description: Build AStra, analyze a Git base diff, update one PR comment, and enforce .astrarc.json.
inputs:
  base:
    description: Git commit or ref to compare against the checked-out working tree.
    required: true
  github-token:
    description: Token with pull request comment write access.
    required: false
  fail_on_error:
    description: Fail the gate when AStra cannot analyze the pull request.
    required: false
    default: "true"
outputs:
  status:
    description: AStra gate status (pass or fail).
    value: ${{ steps.analyze.outputs.status }}
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build AStra
      shell: bash
      run: go build -o "$RUNNER_TEMP/astra" ./cmd/astra

    - name: Analyze changes
      id: analyze
      shell: bash
      env:
        ASTRA_BASE: ${{ inputs.base }}
        ASTRA_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
      run: |
        set +e
        "$RUNNER_TEMP/astra" check --base "$ASTRA_BASE" --json --gate > "$RUNNER_TEMP/astra-report.json" 2> "$RUNNER_TEMP/astra-error.txt"
        astra_exit=$?
        set -e
        node .github/actions/astra-check/report.mjs \
          "$RUNNER_TEMP/astra-report.json" "$GITHUB_EVENT_PATH" "$GITHUB_OUTPUT" \
          "$astra_exit" "$ASTRA_FAIL_ON_ERROR" "$RUNNER_TEMP/astra-error.txt"

    - name: Update AStra pull request comment
      if: steps.analyze.outputs.comment == 'true'
      uses: actions/github-script@v7
      env:
        ASTRA_COMMENT: ${{ steps.analyze.outputs.comment_body }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const body = process.env.ASTRA_COMMENT;
          const marker = "<!-- astra-route-impact-report -->";
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(comment => comment.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce AStra gate
      if: steps.analyze.outputs.status == 'fail'
      shell: bash
      run: |
        echo "AStra gate failed; see the route impact report above."
        exit 1
