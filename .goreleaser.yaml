version: 2

project_name: astra

builds:
  - id: astra
    main: ./cmd/astra
    binary: astra
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: raw
    ids:
      - astra
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Os \"windows\" }}.exe{{ end }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true
